[project]
name = "gamebot-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "adbutils>=2.8",
  "numpy>=2.4.6",
  "opencv-python-headless>=5.0.0.93",
  "keyring>=25.7.0",
  "apscheduler>=3.11.3",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
# onnxruntime has no wheel for Python 3.15 yet; use 3.11-3.14 for OCR
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../server/src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
